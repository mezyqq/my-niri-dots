config_version = 16

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 768.0
    cy = 682.0
    output = "eDP-1"
    placement_height = 864.0
    placement_width = 1536.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[theme]
builtin = "Ayu"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "kitty", "gtk3", "gtk4", "qt", "niri", "btop", "kcolorscheme" ]
    community_ids = [ "pywalfox", "telegram", "fuzzel", "fastfetch", "zed", "opencode", "rofi", "discord" ]
    enable_builtin_templates = true
    enable_community_templates = true

        [theme.templates.user.flameshot]
        input_path = "~/.config/noctalia/templates/flameshot.sh"
        output_path = "~/.cache/noctalia-flameshot.sh"
        post_hook = "sh ~/.cache/noctalia-flameshot.sh"

        [theme.templates.user.launcher]
        input_path = "~/.config/noctalia/templates/launcher-colors.json"
        output_path = "~/.cache/quickshell-launcher/colors.json"

        [theme.templates.user.telegram-preview]
        enabled = false
        input_path = "~/.config/noctalia/templates/telegram-trigger.txt"
        output_path = "~/.cache/noctalia-telegram-trigger.txt"
        post_hook = "sh -c '(sleep 3; pgrep -x AyuGram >/dev/null && AyuGram -- $HOME/.config/telegram-desktop/themes/noctalia.tdesktop-theme) >/dev/null 2>&1 &'"

[wallpaper]
directory = "/home/mezyq/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/mezyq/Pictures/Wallpapers/ddg_22_1788635232125893477.png"

    [wallpaper.last]
    path = "/home/mezyq/Pictures/Wallpapers/ddg_22_1788635232125893477.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/mezyq/Pictures/Wallpapers/ddg_22_1788635232125893477.png"
[bar.main]
background_opacity = 0.75
